[build]
  publish = "."

# Redirect www to non-www
[[redirects]]
  from = "https://www.coloradocashhomebuyers.com/*"
  to = "https://coloradocashhomebuyers.com/:splat"
  status = 301
  force = true

# Custom headers for SEO and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.google.com https://maps.google.com;"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pretty URLs
[[redirects]]
  from = "/areas/denver"
  to = "/areas/denver.html"
  status = 200

[[redirects]]
  from = "/areas/fort-collins"
  to = "/areas/fort-collins.html"
  status = 200

[[redirects]]
  from = "/areas/loveland"
  to = "/areas/loveland.html"
  status = 200

[[redirects]]
  from = "/areas/greeley"
  to = "/areas/greeley.html"
  status = 200

[[redirects]]
  from = "/areas/longmont"
  to = "/areas/longmont.html"
  status = 200

[[redirects]]
  from = "/areas/windsor"
  to = "/areas/windsor.html"
  status = 200
