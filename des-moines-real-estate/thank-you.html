<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Des Moines Cash Home Buyers</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .thank-you-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .thank-you-card {
      max-width: 580px;
      background: var(--dark-2);
      border: 1px solid var(--dark-3);
      border-radius: var(--radius-lg);
      padding: 60px 40px;
      box-shadow: var(--shadow-lg);
    }
    .thank-you-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      display: block;
    }
    .thank-you-card h1 {
      font-size: 2.2rem;
      margin-bottom: 16px;
      color: var(--teal);
    }
    .thank-you-card p {
      font-size: 1.1rem;
      color: var(--silver-light);
      line-height: 1.7;
      margin-bottom: 12px;
    }
    .thank-you-card .phone-cta {
      margin-top: 28px;
      padding-top: 28px;
      border-top: 1px solid var(--dark-3);
    }
    .thank-you-card .phone-cta p {
      font-size: 0.95rem;
      color: var(--silver);
      margin-bottom: 8px;
    }
    .thank-you-card .phone-cta a {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--teal);
    }
    .back-link {
      display: inline-block;
      margin-top: 24px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="thank-you-page">
    <div class="thank-you-card">
      <span class="thank-you-icon">&#10003;</span>
      <h1>Thank You!</h1>
      <p>We received your information and will contact you <strong>within 24 hours</strong> with your no-obligation cash offer.</p>
      <p>Our team reviews every submission personally — you're not just a number to us.</p>
      <div class="phone-cta">
        <p>Need to talk sooner? Call us directly:</p>
        <a href="tel:+13098839464">(309) 883-9464</a>
      </div>
      <a href="/" class="back-link">&larr; Back to Home</a>
    </div>
  </div>
</body>
</html>
