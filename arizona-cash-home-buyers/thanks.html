<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Cactus Property Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .thanks-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--black);
      text-align: center;
      padding: 40px 24px;
    }
    .thanks-content h1 {
      color: var(--white);
      font-size: 2.5rem;
      margin-bottom: 16px;
    }
    .thanks-content .check-icon {
      font-size: 4rem;
      color: var(--green);
      margin-bottom: 24px;
    }
    .thanks-content p {
      color: var(--gray-300);
      font-size: 1.1rem;
      margin-bottom: 32px;
      max-width: 500px;
    }
  </style>
</head>
<body>
  <div class="thanks-page">
    <div class="thanks-content">
      <div class="check-icon">&#10003;</div>
      <h1>Thank You!</h1>
      <p>We've received your information and will reach out within 24 hours with your no-obligation cash offer. Keep an eye on your phone!</p>
      <a href="/" class="btn btn-green btn-lg">&larr; Back to Home</a>
    </div>
  </div>
</body>
</html>
