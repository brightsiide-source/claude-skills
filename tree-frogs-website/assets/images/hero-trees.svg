<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Stylized illustration of forest trees" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0c0b"/>
      <stop offset="60%" stop-color="#0e1a14"/>
      <stop offset="100%" stop-color="#0a2a1f"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa3ad" stop-opacity="0"/>
      <stop offset="100%" stop-color="#9aa3ad" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c7048"/>
      <stop offset="100%" stop-color="#0a2a1f"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#155a3f"/>
      <stop offset="100%" stop-color="#0a2a1f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Silver moon -->
  <circle cx="640" cy="120" r="44" fill="#dde1e6" opacity="0.92"/>
  <circle cx="640" cy="120" r="44" fill="none" stroke="#9aa3ad" stroke-width="1" opacity="0.4"/>

  <!-- Mist band -->
  <rect x="0" y="380" width="800" height="220" fill="url(#mist)"/>

  <!-- Distant ridge -->
  <path d="M0 420 L120 360 L220 410 L340 340 L460 410 L600 360 L720 410 L800 380 L800 600 L0 600 Z" fill="#0a0c0b" opacity="0.85"/>

  <!-- Mid trees: stylized conifers -->
  <g opacity="0.95">
    <!-- left -->
    <polygon points="80,420 50,470 70,470 35,510 75,510 30,560 110,560 75,510 110,510 80,470 105,470" fill="url(#t2)"/>
    <polygon points="170,400 140,460 165,460 125,510 170,510 120,560 215,560 170,510 215,510 175,460 200,460" fill="url(#t1)"/>
    <polygon points="270,420 240,470 260,470 225,510 265,510 220,560 300,560 265,510 300,510 270,470 295,470" fill="url(#t2)"/>
    <!-- mid -->
    <polygon points="380,380 350,440 372,440 335,490 380,490 330,560 425,560 380,490 425,490 385,440 410,440" fill="url(#t1)"/>
    <polygon points="500,420 470,470 490,470 455,510 495,510 450,560 530,560 495,510 530,510 500,470 525,470" fill="url(#t2)"/>
    <!-- right -->
    <polygon points="600,400 570,460 595,460 555,510 600,510 550,560 645,560 600,510 645,510 605,460 630,460" fill="url(#t1)"/>
    <polygon points="700,420 670,470 690,470 655,510 695,510 650,560 730,560 695,510 730,510 700,470 725,470" fill="url(#t2)"/>
  </g>

  <!-- Foreground silhouette trees -->
  <g fill="#0a0c0b">
    <polygon points="-20,440 -50,520 -25,520 -70,580 30,580 -25,520 30,520 -10,440"/>
    <polygon points="780,440 750,520 770,520 730,580 830,580 770,520 830,520 800,440"/>
  </g>

  <!-- Foreground branch -->
  <path d="M0 500 C 220 460, 420 530, 800 470" stroke="#1f2622" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Pine needles on branch (subtle) -->
  <g stroke="#155a3f" stroke-width="2" stroke-linecap="round">
    <path d="M120 490 l-8 -16 M130 488 l8 -16 M250 502 l-8 -16 M260 500 l8 -16 M380 510 l-8 -16 M390 508 l8 -16 M520 506 l-8 -16 M530 504 l8 -16 M660 492 l-8 -16 M670 490 l8 -16"/>
  </g>

  <!-- Refined frog silhouette -->
  <g transform="translate(420 408)">
    <ellipse cx="0" cy="38" rx="62" ry="44" fill="#155a3f"/>
    <circle cx="-26" cy="-4" r="22" fill="#155a3f"/>
    <circle cx="26" cy="-4" r="22" fill="#155a3f"/>
    <circle cx="-26" cy="-4" r="9" fill="#dde1e6"/>
    <circle cx="26" cy="-4" r="9" fill="#dde1e6"/>
    <circle cx="-26" cy="-4" r="4" fill="#0a0c0b"/>
    <circle cx="26" cy="-4" r="4" fill="#0a0c0b"/>
    <path d="M-26 50 Q0 64 26 50" stroke="#0a0c0b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Subtle stars -->
  <g fill="#dde1e6" opacity="0.6">
    <circle cx="80" cy="80" r="1.2"/>
    <circle cx="180" cy="50" r="1"/>
    <circle cx="280" cy="110" r="1.4"/>
    <circle cx="420" cy="60" r="1"/>
    <circle cx="540" cy="90" r="1.2"/>
    <circle cx="730" cy="40" r="1"/>
  </g>
</svg>
