# Netlify build & deploy configuration
# Static site — no build step required.

[build]
  publish = "."

# Strip .html from sub-pages so URLs match the canonical tags
# and sitemap entries (which use the extensionless form).
[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

